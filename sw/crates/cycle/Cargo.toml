[package]
name = "splitsys-cycle"
description = "SplitSys cycle model: predicts every hardware performance counter (SPEC §3.7, §4)"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "splitsys_cycle"
path = "src/lib.rs"

[[bin]]
name = "splitsys-cycle"
path = "src/main.rs"

[dependencies]
splitsys-spec = { path = "../spec" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
